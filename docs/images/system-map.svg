<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">From capture to PARA folders</title>
  <desc id="desc">New notes land in the built-in Notes folder. Weekly filing sends each note to Projects, Areas, Resources, or Archives by actionability.</desc>
  <style>
    text { font-family: "DejaVu Sans", "Liberation Sans", Helvetica, Arial, sans-serif; fill: #1c1917; }
    .small { font-size: 13px; fill: #44403c; }
    .label { font-size: 15px; font-weight: 600; }
    .hint { font-size: 12px; fill: #57534e; }
  </style>
  <rect width="880" height="520" fill="#fafaf9"/>

  <rect x="40" y="36" width="200" height="64" rx="10" fill="#fef9c3" stroke="#a16207"/>
  <text class="label" x="140" y="64" text-anchor="middle">Capture</text>
  <text class="hint" x="140" y="84" text-anchor="middle">Share, Siri, Quick Note</text>

  <rect x="320" y="36" width="240" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c"/>
  <text class="label" x="440" y="64" text-anchor="middle">Notes folder</text>
  <text class="hint" x="440" y="84" text-anchor="middle">Inbox. Do not file yet.</text>

  <line x1="240" y1="68" x2="320" y2="68" stroke="#a8a29e" stroke-width="2"/>
  <polygon points="320,68 310,63 310,73" fill="#a8a29e"/>

  <rect x="640" y="36" width="200" height="64" rx="10" fill="#e0e7ff" stroke="#3730a3"/>
  <text class="label" x="740" y="64" text-anchor="middle">Organise</text>
  <text class="hint" x="740" y="84" text-anchor="middle">Finish-line questions</text>

  <line x1="560" y1="68" x2="640" y2="68" stroke="#a8a29e" stroke-width="2"/>
  <polygon points="640,68 630,63 630,73" fill="#a8a29e"/>

  <rect x="40" y="160" width="190" height="88" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
  <text class="label" x="135" y="196" text-anchor="middle">Projects</text>
  <text class="hint" x="135" y="218" text-anchor="middle">Has a finish line</text>
  <text class="hint" x="135" y="236" text-anchor="middle">One note per outcome</text>

  <rect x="250" y="160" width="190" height="88" rx="10" fill="#dcfce7" stroke="#166534"/>
  <text class="label" x="345" y="196" text-anchor="middle">Areas</text>
  <text class="hint" x="345" y="218" text-anchor="middle">Ongoing standard</text>
  <text class="hint" x="345" y="236" text-anchor="middle">No end date</text>

  <rect x="460" y="160" width="190" height="88" rx="10" fill="#ffedd5" stroke="#c2410c"/>
  <text class="label" x="555" y="196" text-anchor="middle">Resources</text>
  <text class="hint" x="555" y="218" text-anchor="middle">Useful later</text>
  <text class="hint" x="555" y="236" text-anchor="middle">No commitment yet</text>

  <rect x="670" y="160" width="170" height="88" rx="10" fill="#f5f5f4" stroke="#57534e"/>
  <text class="label" x="755" y="196" text-anchor="middle">Archives</text>
  <text class="hint" x="755" y="218" text-anchor="middle">Inactive on purpose</text>
  <text class="hint" x="755" y="236" text-anchor="middle">Still searchable</text>

  <line x1="740" y1="100" x2="135" y2="160" stroke="#a8a29e" stroke-width="2"/>
  <line x1="740" y1="100" x2="345" y2="160" stroke="#a8a29e" stroke-width="2"/>
  <line x1="740" y1="100" x2="555" y2="160" stroke="#a8a29e" stroke-width="2"/>
  <line x1="740" y1="100" x2="755" y2="160" stroke="#a8a29e" stroke-width="2"/>

  <rect x="40" y="300" width="800" height="72" rx="10" fill="#eef2ff" stroke="#4338ca"/>
  <text class="label" x="60" y="332">Finished project</text>
  <text class="small" x="60" y="354">Move the note or subfolder from Projects into Archives. Keep lasting records in the matching Area.</text>

  <line x1="135" y1="248" x2="135" y2="300" stroke="#a8a29e" stroke-width="2"/>
  <polygon points="135,300 130,290 140,290" fill="#a8a29e"/>
  <line x1="135" y1="336" x2="670" y2="204" stroke="#a8a29e" stroke-width="2" stroke-dasharray="4 4"/>

  <text class="label" x="40" y="420">What you open when you work</text>
  <text class="small" x="40" y="444">The project or area note first. Search if you only remember a word. Reminders holds the next action; Notes holds the material.</text>
  <text class="hint" x="40" y="480">Tags such as #work are optional overlays. They are not PARA buckets. Do not convert the four folders into Smart Folders.</text>
</svg>
